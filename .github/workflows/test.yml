name: テスト

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.9 は pyproject.toml の requires-python の下限、3.x はその時点の最新
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: mdtable と依存（openpyxl）を入れる
        run: python -m pip install --disable-pip-version-check .
      - name: テストを動かす
        run: python -B -m unittest discover -s tests -v
